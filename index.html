<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Budget Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Card 1: Page Header -->
  <header class="card header-card">
    <h1>Budget Tracker</h1>
    <p>Track your daily expenses and keep your finances in check.</p>
  </header>

  <!-- Card 2: Add Expense Form -->
  <section class="card form-card">
    <h2>Add New Expense</h2>
    <form id="expense-form">
      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" id="description" placeholder="e.g. Groceries" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="" disabled selected>Select Category</option>
          <option value="Food">Food & Dining</option>
          <option value="Transport">Transportation</option>
          <option value="Utilities">Utilities & Bills</option>
          <option value="Entertainment">Entertainment</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">Amount ($)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
      </div>

      <button type="submit" class="btn btn-primary">Add Expense</button>
    </form>
  </section>

  <!-- Card 3: Expense Table -->
  <section class="card table-card">
    <h2>Expense Log</h2>
    <table class="expense-table">
      <thead>
        <tr>
          <th>Description</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Weekly Grocery Run</td>
          <td>Food</td>
          <td>$124.50</td>
          <td><button class="btn btn-danger">Delete</button></td>
        </tr>
        <tr>
          <td>Monthly Internet Bill</td>
          <td>Utilities</td>
          <td>$60.00</td>
          <td><button class="btn btn-danger">Delete</button></td>
        </tr>
        <tr>
          <td>Bus Pass Top-up</td>
          <td>Transport</td>
          <td>$35.00</td>
          <td><button class="btn btn-danger">Delete</button></td>
        </tr>
      </tbody>
    </table>
  </section>

</body>
</html>
